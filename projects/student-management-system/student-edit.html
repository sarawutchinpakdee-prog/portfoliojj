<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบงานทะเบียน @101</title>
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body>
    <header id="header"></header>

    <main class="max-w-7xl mx-auto my-4 md:my-8">
      <form
        class="mx-auto max-w-md space-y-4 rounded-lg border border-gray-300 p-6"
      >
        <div>
          <label class="text-sm font-medium text-gray-900" for="student_id"
            >Student ID</label
          >

          <input
            class="mt-1 w-full rounded-lg px-3 py-2 text-gray-400 border border-gray-300 focus:border-indigo-500 focus:outline-none"
            id="student_id"
            type="text"
            maxlength="11"
            readonly
            placeholder="กรอกรหัสนักศึกษา 11 หลัก (ตัวเลข)"
          />
        </div>
        <div>
          <label class="text-sm font-medium text-gray-900" for="student"
            >Name</label
          >
          <span class="text-red-500">*</span>

          <input
            class="mt-1 w-full rounded-lg px-3 py-2 border border-gray-300 focus:border-indigo-500 focus:outline-none"
            id="student"
            type="text"
            required
            placeholder="Your name"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-900" for="email"
            >Email</label
          >

          <input
            class="mt-1 w-full rounded-lg px-3 py-2 border border-gray-300 focus:border-indigo-500 focus:outline-none"
            id="email"
            type="email"
            placeholder="Your email"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-900" for="address"
            >Address</label
          >

          <textarea
            class="mt-1 w-full resize-none rounded-lg px-3 py-2 border border-gray-300 focus:border-indigo-500 focus:outline-none"
            id="address"
            rows="4"
            placeholder="Your Address"
          ></textarea>
        </div>

        <div id="message" class="text-center text-xl text-red-500"></div>

        <button
          class="block w-full rounded-lg border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white transition-colors hover:bg-transparent hover:text-indigo-600 cursor-pointer"
          type="button"
          id="btnSubmit"
          onclick="saveStudent()"
        >
          Save Student
        </button>
      </form>
    </main>
  </body>
</html>

<script>
  async function loadData() {
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const student_id = urlParams.get("id");
    const endpoint = `http://surachai.edit.in.th:9000/api/student/${student_id}`;
    // const endpoint = `http://surachai.edit.in.th:9000/api/student/69319010001`;

    await fetch(endpoint)
      .then(async (response) => await response.json())
      .then((res) => {
        if (res.success) {
          const student = res.data[0].student;
          const email = res.data[0].email;
          const address = res.data[0].address;

          // Fill Data
          document.querySelector("#student_id").value = student_id;
          document.querySelector("#student").value = student;
          document.querySelector("#email").value = email;
          document.querySelector("#address").value = address;
        } else {
          console.log("Load Student Error");
        }
      });
  }

  async function saveStudent() {
    const student_id = document.querySelector("#student_id").value;
    const student = document.querySelector("#student").value;
    const email = document.querySelector("#email").value;
    const address = document.querySelector("#address").value;

    if (!student_id || !student) {
      message.innerHTML = "โปรดตรวจสอบข้อมูล !!";
      setInterval(() => {
        message.innerHTML = "";
      }, 2000);
      return;
    }

    if (student_id.length < 11 || isNaN(Number(student_id))) {
      message.innerHTML = "รหัสนักศึกษาประกอบด้วยตัวเลข 11 หลัก !!";
      setInterval(() => {
        message.innerHTML = "";
      }, 2000);
      return;
    }

    if (email.length != 0) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        message.innerHTML = "ตรวจสอบ Email !!";
        setInterval(() => {
          message.innerHTML = "";
        }, 2000);
        return;
      }
    }

    const data = {
      student: student,
      email: email,
      address: address,
    };
    const endpoint = `http://surachai.edit.in.th:9000/api/student/${student_id}`;
    await fetch(endpoint, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json", // Tell the server you're sending JSON
      },
      body: JSON.stringify(data),
    })
      .then((res) => res.json())
      .then((data) => {
        if (data.success) {
          window.location = "student.html";
        }
      });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const header = document.querySelector("#header");
    await fetch("components/navbar.html")
      .then((response) => response.text())
      .then((res) => {
        header.innerHTML = res;
      });

    loadData();
  });
</script>
