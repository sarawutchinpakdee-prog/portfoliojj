<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function 1</title>
</head>
<body>
    <p>
        <label for="num1">ค่าแรก</label>
        <input type="number" id ="num1"/>
    </p>
    <p>
        <label for="num2">ค่าที่สอง</label>
        <input type="number" id ="num2"/>
    </p>
    <p>
        <input type="button" value="คำนวณ" onclick="add()"/>
    </p>
<p>
     <h1 id="show">????</h1>
</p>
<script>
    function   add(){
        let num1 = document.querySelector("#num1").value;
        let num2 = document.querySelector("#num2").value;
        let answer = Number(num1) + parseInt(num2);
        document.querySelector("#show").textContent = answer;
    }
</script>




</body>
</html>
