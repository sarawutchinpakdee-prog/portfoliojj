      var handsome = false; //"ค่าความจริง(boolean) มี 2 อย่าง มีค่า true หรือ false"
      var salary = 5 % 2;
      document.write(
        `สวัสดีครับ: ${name}, อายุ: ${age} ปี`,
        `เกรดเฉลี่ย: (${gpa})`,
      );
      document.write(`<br> 5%2 = ${salary}`);

    </script>
