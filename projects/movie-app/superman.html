    <main class="bg-gray-50 min-h-screen">

        <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl">รายการหนัง</h1>
        <p class="mt-1 text-sm text-gray-500">ผลการค้นหาสำหรับ "superman"</p>

        <div id="show" class="mt-8 grid grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
      </div>
    </main>


</body>

<script>
  let apikey = "55166850"
  let show = document.getElementById("show");


  document.addEventListener("DOMContentLoaded", async function () {
    await fetch(`https://www.omdbapi.com/?apikey=55166850&s=superman `).then(
      async (res) => {
        let movies = await res.json();
        for (const m of movies.Search) {
         // show.innerHTML += `ชื่อหนัง: ${m.Title} <br> ปีที่สร้าง: ${m.Year}<br> รหัสหนัง: ${m.imdbID}<br> ประเภท: ${m.Type}<br> ที่อยู่โปสเตอร์: ${m.Poster}<hr />`;


         show.innerHTML += `<div class="group overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-gray-200 transition duration-200 hover:-translate-y-1 hover:shadow-lg">
  <div class="aspect-[2/3] w-full overflow-hidden bg-gray-100">
    <img
      alt="${m.Title}"
      src="${m.Poster}"
      class="h-full w-full object-cover transition duration-200 group-hover:scale-105"
    />
  </div>

  <div class="p-3">
    <h3 class="truncate font-semibold text-gray-900" title="${m.Title}">${m.Title}</h3>

    <p class="mt-1 text-xs text-gray-500">
        ${m.Year} &middot; ${m.Type}
    </p>
    <p class="mt-0.5 truncate text-xs text-gray-400" title="${m.imdbID}">
        รหัสหนัง: ${m.imdbID}
    </p>
  </div>
</div>`

        }

      },
    );
  });
</script>
